<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Pump Radar - Solana</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 16px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: #38bdf8;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #334155;
            color: #cbd5e1;
            font-weight: 600;
        }
        tr:hover {
            background-color: #262f45;
        }
        .loading, .error {
            text-align: center;
            padding: 24px;
            color: #94a3b8;
        }
        .error {
            color: #f87171;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>🚀 Meme Pump Radar</h1>
    <p class="subtitle">Monitoraggio in tempo reale Solana (Liquidity &gt; $25k)</p>

    <div class="table-container">
        <div id="content" class="loading">Caricamento dati in corso...</div>
    </div>

    <script>
        async function loadData() {
            const container = document.getElementById('content');
            try {
                // Aggiungiamo un timestamp per evitare che Safari metta in cache il file JSON
                const response = await fetch('alerted_pairs.json?t=' + new Date().getTime());
                if (!response.ok) {
                    throw new Error("File dei dati non ancora disponibile o vuoto.");
                }
                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="loading">Nessuna meme coin trovata al momento. Il radar è in ascolto...</div>`;
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Token / Nome</th>
                                <th>Indirizzo / CA</th>
                                <th>Liquidità ($)</th>
                                <th>Volume</th>
                                <th>Orario Segnale</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                // Itera sui dati (ipotizzando un array di oggetti o un formato simile salvato dal radar)
                // Adatta le chiavi (es. name, address, liquidity) in base a come li salva il tuo script Python
                data.forEach(item => {
                    html += `
                        <tr>
                            <td><strong>${item.name || 'N/D'}</strong> (${item.symbol || 'N/D'})</td>
                            <td><a href="https://solscan.io/token/${item.address}" target="_blank">${item.address ? item.address.slice(0, 6) + '...' + item.address.slice(-4) : 'N/D'}</a></td>
                            <td>$${item.liquidity ? Number(item.liquidity).toLocaleString() : '0'}</td>
                            <td>$${item.volume ? Number(item.volume).toLocaleString() : '0'}</td>
                            <td>${item.timestamp || 'N/D'}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `<div class="error">In attesa del primo avvio del bot o file JSON non ancora generato.<br><small>${err.message}</small></div>`;
            }
        }

        // Carica i dati all'avvio e aggiorna ogni 60 secondi
        loadData();
        setInterval(loadData, 60000);
    </script>

</body>
</html>
