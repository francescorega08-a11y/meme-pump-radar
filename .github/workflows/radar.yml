
name: Meme Pump Radar AI

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: meme-pump-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install requests

      - name: Esegui radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py

      - name: Salva lo stato del radar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f radar_state.json ]; then
            git add radar_state.json
          fi

          if [ -f alerted_pairs.json ]; then
            git add alerted_pairs.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna stato Meme Pump Radar"
            git push
          else
            echo "Nessuna modifica allo stato."
          fi
