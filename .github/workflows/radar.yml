
name: Meme Pump Radar AI

on:
  workflow_dispatch:
  schedule:
      - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: meme-pump-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install requests

      - name: Esegui radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py

      - name: Salva stato e dati
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_state.json radar_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna stato e dati del radar"
            git push
          else
            echo "Nessuna modifica da salvare."
          fi
