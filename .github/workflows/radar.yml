
name: Meme Pump Radar AI

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: meme-pump-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Esegui Meme Pump Radar AI
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python radar.py

      - name: Salva dati e sincronizza GitHub
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add radar_data.json radar_state.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git commit -m "Aggiorna stato e dati del radar"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
