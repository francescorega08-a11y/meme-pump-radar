
name: Meme Pump Radar AI

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: meme-pump-radar-main
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Avvia il radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py

      - name: Salva stato e dati del radar
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add radar_state.json radar_data.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
            exit 0
          fi

          git commit -m "Aggiorna stato e dati del radar"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
